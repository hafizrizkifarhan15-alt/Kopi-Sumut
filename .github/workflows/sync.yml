name: KOPI_SUMUT Database Sync

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kopi-sumut-sync
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize Kopi Sumut
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATAWAREHOUSE_URL: ${{ secrets.DB_PUSAT }}
      DB_PUSAT: ${{ secrets.DB_PUSAT }}
      DB_KARO: ${{ secrets.DB_KARO }}
      DB_DAIRI: ${{ secrets.DB_DAIRI }}
      DB_HUMBANG_HASUNDUTAN: ${{ secrets.DB_HUMBANG_HASUNDUTAN }}
      DB_TAPANULI_UTARA: ${{ secrets.DB_TAPANULI_UTARA }}
      DB_TAPANULI_SELATAN: ${{ secrets.DB_TAPANULI_SELATAN }}
      DB_SIMALUNGUN: ${{ secrets.DB_SIMALUNGUN }}
      DB_MANDAILING_NATAL: ${{ secrets.DB_MANDAILING_NATAL }}

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check database configuration
        shell: bash
        run: |
          if [ -z "$DATAWAREHOUSE_URL" ]; then
            echo "::error::Secret DB_PUSAT belum tersedia atau kosong."
            exit 1
          fi
          echo "Konfigurasi database pusat tersedia."

      - name: Check Python syntax
        run: |
          python -m py_compile sync.py

           - name: Synchronize databases
        run: |
          python etl_sync.py
